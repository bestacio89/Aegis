name: architecture performance baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  architecture-performance:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: run architecture benchmarks
        shell: pwsh
        run: dotnet run --project benchmarks/Aegis.Architecture.Benchmarks/Aegis.Architecture.Benchmarks.csproj --configuration Release -- --filter "*" --artifacts ./BenchmarkDotNet.Artifacts

      - name: upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-performance-${{ github.sha }}
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: error
