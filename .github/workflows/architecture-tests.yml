name: non-WPF quality gates

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: non-wpf-quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  non-wpf-quality-gates:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: run all non-WPF test projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem tests -Recurse -Filter *.csproj | Sort-Object FullName
          if (-not $projects) {
            throw "No test projects were discovered under tests/."
          }

          foreach ($project in $projects) {
            Write-Host "::group::Testing $($project.FullName)"
            dotnet test $project.FullName --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=$($project.BaseName).trx" --collect "XPlat Code Coverage"
            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed for $($project.FullName)."
            }
            Write-Host "::endgroup::"
          }

      - name: build all non-WPF production projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem sources -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '[\\/]Aegis\.App\.WPF[\\/]' } |
            Sort-Object FullName

          if (-not $projects) {
            throw "No non-WPF production projects were discovered under sources/."
          }

          foreach ($project in $projects) {
            Write-Host "::group::Building $($project.FullName)"
            dotnet build $project.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $($project.FullName)."
            }
            Write-Host "::endgroup::"
          }

      - name: upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-wpf-test-results
          path: |
            tests/**/TestResults/**/*.trx
            tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
