name: architecture tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  architecture-tests:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: run architecture tests
        run: dotnet test tests/Aegis.Architecture.Tests/Aegis.Architecture.Tests.csproj --configuration Release
