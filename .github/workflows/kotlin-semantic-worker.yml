name: Kotlin semantic worker

on:
  pull_request:
    paths:
      - 'tools/kotlin-worker-prototype/**'
      - '.github/workflows/kotlin-semantic-worker.yml'
      - 'docs/roadmaps/KOTLIN-FIRST-CLASS-SUPPORT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-semantic-worker:
    name: Kotlin K2 semantic extraction (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/kotlin-worker-prototype/pom.xml

      - name: Verify Kotlin worker and private runtime package
        run: mvn --batch-mode --no-transfer-progress -f tools/kotlin-worker-prototype/pom.xml verify

      - name: Probe packaged Kotlin worker process
        shell: pwsh
        run: ./tools/kotlin-worker-prototype/packaging/Probe-PackagedWorker.ps1 -JavaExecutable java -WorkerJar ./tools/kotlin-worker-prototype/target/runtime/kotlin-worker.jar -LibrariesDirectory ./tools/kotlin-worker-prototype/target/runtime/lib

      - name: Upload private runtime and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-kotlin-worker-${{ matrix.os }}
          path: |
            tools/kotlin-worker-prototype/target/runtime/**
            tools/kotlin-worker-prototype/target/bom.json
          if-no-files-found: warn
          retention-days: 14
