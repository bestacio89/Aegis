name: Kotlin semantic worker

on:
  pull_request:
    paths:
      - 'tools/kotlin-worker-prototype/**'
      - '.github/workflows/kotlin-semantic-worker.yml'
      - 'docs/roadmaps/KOTLIN-FIRST-CLASS-SUPPORT.md'
      - 'sources/Aegis.Architecture/Analysis/Semantics/**'
      - 'sources/Aegis.Architecture/Bootstrap/DependencyInjection.cs'
      - 'sources/Aegis.Shared/Architecture/Models/SemanticAnalysisRequest.cs'
      - 'tests/Aegis.Architecture.Tests/**'
      - '.github/actions/package-java-worker/**'
      - '.github/workflows/architecture-tests.yml'
      - '.github/workflows/wpf-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-semantic-worker:
    name: Kotlin K2 semantic extraction (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/kotlin-worker-prototype/pom.xml

      - name: Verify Kotlin worker and private runtime package
        run: mvn --batch-mode --no-transfer-progress -f tools/kotlin-worker-prototype/pom.xml verify

      - name: Probe packaged Kotlin worker process
        shell: pwsh
        run: ./tools/kotlin-worker-prototype/packaging/Probe-PackagedWorker.ps1 -JavaExecutable java -WorkerJar ./tools/kotlin-worker-prototype/target/runtime/kotlin-worker.jar -LibrariesDirectory ./tools/kotlin-worker-prototype/target/runtime/lib

      - name: Upload private runtime and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-kotlin-worker-${{ matrix.os }}
          path: |
            tools/kotlin-worker-prototype/target/runtime/**
            tools/kotlin-worker-prototype/target/bom.json
          if-no-files-found: warn
          retention-days: 14

  kotlin-host-integration:
    name: .NET host and packaged Kotlin worker (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package Java and Kotlin workers with the private JVM runtime
        uses: ./.github/actions/package-java-worker

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore architecture tests
        run: dotnet restore tests/Aegis.Architecture.Tests/Aegis.Architecture.Tests.csproj

      - name: Run semantic host integration tests
        env:
          AEGIS_JAVA_WORKER_PACKAGE: ${{ github.workspace }}/artifacts/java-worker-package/Java
        run: dotnet test tests/Aegis.Architecture.Tests/Aegis.Architecture.Tests.csproj --configuration Release --no-restore
