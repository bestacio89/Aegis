name: WPF build validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: wpf-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wpf-build:
    name: Build WPF desktop application
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Eclipse JDT worker and private runtime
        uses: ./.github/actions/package-java-worker

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore WPF application
        run: dotnet restore sources/Aegis.App.WPF/Aegis.Wpf.csproj

      - name: Build WPF application
        run: dotnet build sources/Aegis.App.WPF/Aegis.Wpf.csproj --configuration Release --no-restore

      - name: Restore WPF ViewModel tests
        run: dotnet restore tests/Aegis.Wpf.Tests/Aegis.Wpf.Tests.csproj

      - name: Run WPF ViewModel tests
        run: dotnet test tests/Aegis.Wpf.Tests/Aegis.Wpf.Tests.csproj --configuration Release --no-restore
