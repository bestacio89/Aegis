# Static projection of the J1 fixture module/source-set/dependency evidence.
# Paths are relative to tests/Aegis.Architecture.Tests/Fixtures/Java.
modules=api,consumer,test-support,isolated,runtime-probe,conflict-probe
module.api.production=ModuleVisibility/api/src/main/java
module.consumer.production=ModuleVisibility/consumer/src/main/java
module.consumer.dependencies=api
module.consumer.test=ModuleVisibility/consumer/src/test/java
module.consumer.testDependencies=test-support
module.test-support.production=ModuleVisibility/test-support/src/main/java
module.isolated.production=ModuleVisibility/isolated/src/main/java
module.isolated.dependencies=
# module,source-set,FQN,expected-result
expectations=consumer,production,org.aegis.visibility.api.VisibleApi,resolved;isolated,production,org.aegis.visibility.api.VisibleApi,unresolved;isolated,production,org.springframework.context.ApplicationContext,unresolved;consumer,production,org.aegis.visibility.support.TestSupport,unresolved;consumer,test,org.aegis.visibility.support.TestSupport,resolved;consumer,production,org.springframework.context.ApplicationContext,resolved;consumer,production,org.mapstruct.Mapper,resolved;consumer,production,org.springframework.core.io.Resource,unresolved;consumer,test,org.junit.jupiter.api.Test,resolved;consumer,production,org.junit.jupiter.api.Test,unresolved;runtime-probe,production,org.apache.commons.logging.Log,unresolved;conflict-probe,production,org.springframework.core.SpringVersion,resolved

# Resolved artifact snapshots are module-owned and intentionally separate from J1 declarations.
# These pinned Maven fixture POMs exercise classpath ownership; they are not claimed as J1 output.
module.consumer.compileClasspath=consumer.txt
module.consumer.testClasspath=consumer-test.txt
module.consumer.requiredArtifacts=spring-context-6.2.8.jar,mapstruct-1.6.3.jar,junit-jupiter-api-5.12.2.jar
module.consumer.forbiddenArtifacts=spring-core-
module.runtime-probe.production=ModuleVisibility/runtime-probe/src/main/java
module.runtime-probe.runtimeClasspath=runtime.txt
module.runtime-probe.requiredArtifacts=spring-jcl-6.2.8.jar
module.conflict-probe.production=ModuleVisibility/conflict-probe/src/main/java
module.conflict-probe.compileClasspath=conflict.txt
module.conflict-probe.requiredArtifacts=spring-core-6.1.0.jar
module.conflict-probe.forbiddenArtifacts=spring-core-6.2.8.jar
